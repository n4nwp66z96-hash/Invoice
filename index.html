<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قائمة - شركة نبض الأبهر الدولية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<style>
:root{--bg:#e9e9ec;--bar:#fff;--tx:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1e;--bar:#2c2c2e;--tx:#eee}}
:root[data-theme="dark"]{--bg:#1c1c1e;--bar:#2c2c2e;--tx:#eee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Simplified Arabic","Noto Naskh Arabic",Tahoma,Arial,sans-serif}
.bar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:10px;background:var(--bar);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;font-size:13px}
.bar button{font:inherit;padding:9px 14px;border:0;border-radius:8px;background:#444;color:#fff}
.bar button.p{background:#0a7d4f}.bar input{width:90px;padding:7px}
.wrap{overflow-x:auto;padding:10px}
.inv{width:800px;margin:0 auto;background:#fff;color:#111;padding:10px 14px 14px;box-shadow:0 1px 8px #0003;font-size:13px;min-height:1130px;position:relative;display:flex;flex-direction:column}
.inv img.b{width:100%;display:block}
.row{display:flex;gap:6px;margin:6px 0}
.c{display:flex;gap:3px;align-items:center}
.lb{background:#d9d9d9;padding:5px 6px;min-width:62px;text-align:center;font-weight:bold;font-size:12px;white-space:nowrap}
input{font:inherit;border:1px solid #ddd;padding:4px;width:100%;box-sizing:border-box;background:#fff;color:#111;text-align:center;min-width:0}
.g{background:#bdbdbd}
table{width:100%;border-collapse:collapse;margin:8px 0 6px}
th{background:#d9d9d9;padding:5px 2px;font-size:12px;border:2px solid #fff}
td{border:1px solid #ccc;padding:0}td input{border:0;padding:6px 3px}
td.n{text-align:center;width:30px;color:#1a3fa0}
.tot{width:66%;margin-top:6px}
.tot .r{display:flex;gap:6px;margin-bottom:5px;align-items:center}
.tot .r>*:first-child{width:150px;flex:none}
.tot .lb{min-width:0}.tot input{border:0;font-weight:bold;font-size:15px;text-align:left;direction:ltr}
.tot .h{flex:1;text-align:center;background:#d9d9d9;padding:5px;font-weight:bold}
.foot{margin-top:auto;padding-top:40px}
.del{background:#c33;color:#fff;border:0;width:100%}
.cap .no-print{display:none!important}.cap input{border-color:transparent!important}
@media print{.no-print{display:none!important}body{background:#fff}.inv{box-shadow:none;width:100%}.wrap{padding:0}input{border-color:transparent}@page{size:A4;margin:8mm}}
.info{display:grid;grid-template-columns:92px 120px 92px 1fr 52px 44px 52px 44px;gap:5px;margin:10px 0}
.info .lb{display:flex;align-items:center;justify-content:center;min-width:0;padding:0 4px}
.info input{height:32px;border:1px solid #bbb;font-size:14px}
.info .pg{grid-column:5/9;display:flex;align-items:center;justify-content:center;color:#1a3fa0;font-weight:700;font-size:13px}
.iv{display:flex;align-items:center;justify-content:center;min-height:32px;box-sizing:border-box;border:1px solid #bbb;padding:2px 4px;font-size:14px;text-align:center;word-break:break-word;background:#fff;color:#111}
.iv.g{background:#bdbdbd}td .iv{border:0;min-height:34px}td input{height:34px;font-size:14px}
.tot .iv{border:0;font-weight:700;font-size:15px}.lb{font-weight:700}
.inv,.inv *{font-family:"Simplified Arabic","Noto Naskh Arabic",Tahoma,Arial,sans-serif!important;font-size:14px!important}.inv .lb,.inv th{font-weight:700}
.iv{width:100%}.info input,.info .iv{border:0}.info .g{background:#bdbdbd}
.inv .lb,.inv th,.inv .tot .h{background:#d3d3d3}
</style></head><body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const f=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=s=>parseFloat(String(s).replace(/,/g,''))||0;
const $=id=>document.getElementById(id),p=x=>String(x).padStart(2,'0');
function addRow(){const tb=$('rows'),tr=tb.insertRow();
tr.innerHTML=`<td class="n"></td><td><input></td><td><input></td><td><input></td><td><input value="قطعة"></td><td><input class="q" inputmode="decimal" oninput="calc()"></td><td><input class="p" inputmode="decimal" oninput="calc()"></td><td><input class="a" readonly></td><td class="no-print"><button class="del" onclick="this.closest('tr').remove();calc()">✕</button></td>`;calc()}
function calc(){let t=0;[...$('rows').rows].forEach((r,i)=>{r.cells[0].textContent=i+1;const a=num(r.querySelector('.q').value)*num(r.querySelector('.p').value);r.querySelector('.a').value=a?f(a):'';t+=a});
const af=t-num($('disc').value);$('t1').value=f(t);$('t2').value=f(af);$('cur').value=f(num($('prev').value)+af)}
function stamp(){const d=new Date();$('pd').value=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} ${$('date').value}`}
const d=new Date();$('date').value=`${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;

async function savePdf(){
 const b=$('pdfb');b.disabled=true;b.textContent='جاري التجهيز...';stamp();
 const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:794px';
 const src=document.querySelector('.inv'),orig=[...src.querySelectorAll('input')],el=src.cloneNode(true);
 el.querySelectorAll('.no-print').forEach(x=>x.remove());
 el.querySelectorAll('input').forEach((i,k)=>{const o=orig[k],cs=getComputedStyle(o),d=document.createElement('div');d.className=(i.className+' iv').trim();d.style.cssText=i.style.cssText;d.textContent=o.value;d.style.direction=cs.direction;d.style.justifyContent=cs.textAlign==='left'?'flex-start':'center';i.replaceWith(d)});
 el.style.width='794px';el.style.minHeight='1123px';el.style.boxShadow='none';el.style.margin='0';
 host.appendChild(el);document.body.appendChild(host);
 try{
  await document.fonts.ready;
  const cv=await html2canvas(el,{scale:3,backgroundColor:'#fff',useCORS:true});
  const {jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4');
  const W=210,H=297;let w=W,h=cv.height*W/cv.width;if(h>H){w=W*H/h;h=H}
  pdf.addImage(cv.toDataURL('image/jpeg',.97),'JPEG',(W-w)/2,0,w,h);
  const blob=pdf.output('blob'),dl=(window.claude&&claude.use)?await claude.use('downloads'):null;
  if(dl){await dl.save({filename:'invoice-'+($('no').value||'new')+'.pdf',data:blob})}else{pdf.save('invoice-'+($('no').value||'new')+'.pdf')}
 }catch(e){if(!e||e.code!=='declined')alert('تعذر حفظ الـPDF، استخدم زر الطباعة واختار Save as PDF')}
 host.remove();b.disabled=false;b.textContent='📄 حفظ PDF';
}
window.addEventListener('beforeprint',stamp);stamp();addRow();
</script></body></html>
